spring.application.name=extract-api-test
server.port=0

# H2 in-memory database (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE,DATE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# These are fast unit/web-slice tests. PostgreSQL/Flyway integration coverage
# belongs in the dedicated Testcontainers phase.
spring.flyway.enabled=false

# Disable .env file import for CI/test environments
spring.config.import=

# Test values
cors.allowed-origin=http://localhost:5173
ai.api-key=test-gemini-api-key-1234567890123456
ai.gemini-model=gemini-3-flash-preview
ai.gemini-timeout=3m
ai.default-timeout=90s
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
admin.email.sender=sender@gmail.com
admin.email.recipients=recipient@gmail.com
admin.email.api-key=test-admin-email-api-key-1234567890

# Scheduling is exercised explicitly by service tests. Keep background jobs
# disabled so unit and web-slice tests never race the in-memory database.
classification.catalog-registration-cron=-
classification.batch-creation-cron=-
classification.ai-cron=-
classification.ai-recovery-cron=-
classification.apply-cron=-
classification.apply-recovery-cron=-
classification.propagation-cron=-
