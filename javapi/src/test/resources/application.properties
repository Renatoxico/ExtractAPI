spring.application.name=extract-api-test
server.port=0

# H2 in-memory database (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE,DATE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# These are fast unit/web-slice tests. PostgreSQL/Flyway integration coverage
# belongs in the dedicated Testcontainers phase.
spring.flyway.enabled=false

# Disable .env file import for CI/test environments
spring.config.import=

# Test values
cors.allowed-origin=http://localhost:5173
api.key=test-api-key
