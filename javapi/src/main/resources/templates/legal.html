<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Somaí</title>
    <style>
        :root {
            --bg-page: #0f1115;
            --panel-bg: #161920;
            --panel-border: rgba(16, 185, 129, 0.14);
            --primary-green: #10b981;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --surface-1: #1e2330;
            --radius-md: 12px;
            --placeholder: #f5c451;
            --placeholder-ink: #1c1403;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        header {
            border-bottom: 1px solid var(--panel-border);
            background: var(--panel-bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            color: var(--primary-green);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 1rem;
        }

        nav a, footer a, main a {
            color: var(--primary-green);
            text-decoration: none;
        }

        nav a:hover, footer a:hover, main a:hover { text-decoration: underline; }

        .pending-banner {
            display: block;
            padding: 0.8rem 1.25rem;
            background: var(--placeholder);
            color: var(--placeholder-ink);
            text-align: center;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 650;
        }

        .pending-banner:hover { text-decoration: underline; }

        .pending-banner code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8125rem;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        main h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }

        main h2 {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary-green);
            margin: 2rem 0 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--panel-border);
        }

        main h3 {
            font-size: 1rem;
            margin: 1.25rem 0 0.5rem;
        }

        main p, main li {
            color: var(--text-muted);
            font-size: 0.9375rem;
        }

        main p { margin-bottom: 0.75rem; }

        main ul, main ol {
            margin: 0 0 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        main blockquote {
            margin: 0 0 1.5rem;
            padding: 0.9rem 1.1rem;
            border-left: 3px solid var(--placeholder);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            background: rgba(245, 196, 81, 0.08);
            color: var(--text-muted);
        }

        main blockquote p:last-child { margin-bottom: 0; }

        main strong { color: var(--text-main); }

        main code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.84em;
            color: var(--text-main);
        }

        main table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5rem 0 1.25rem;
            font-size: 0.875rem;
            display: block;
            overflow-x: auto;
        }

        main th, main td {
            border: 1px solid var(--panel-border);
            padding: 0.55rem 0.7rem;
            vertical-align: top;
            text-align: left;
            min-width: 8rem;
        }

        main th {
            color: var(--primary-green);
            background: var(--surface-1);
        }

        main td { color: var(--text-muted); }

        mark.placeholder {
            background: var(--placeholder);
            color: var(--placeholder-ink);
            padding: 0.05em 0.28em;
            border-radius: 4px;
            font-weight: 700;
            box-shadow: inset 0 -1px 0 #a16207;
            scroll-margin-top: 5.5rem;
        }

        footer {
            border-top: 1px solid var(--panel-border);
            padding: 2rem 1.5rem;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-dim);
        }

        @media (max-width: 600px) {
            main { padding: 2rem 1rem 3rem; }
            main h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <a href="/" class="logo">Somaí</a>
        <nav aria-label="Documentos legais">
            <a href="/terms">Termos</a>
            <a href="/privacy">Privacidade</a>
        </nav>
    </div>
</header>
<a class="pending-banner" th:if="${placeholderCount > 0}" href="#placeholder-1">
    <strong th:text="${placeholderCount}">0</strong>
    trechos pendentes, em amarelo, ainda estão como no rascunho
    (<code>[PREENCHER]</code> e <code>[CONFIRMAR]</code>).
    Ir ao primeiro.
</a>
<main th:utext="${documentHtml}"></main>
<footer>
    &copy; 2026 Somaí. Todos os direitos reservados.
    &nbsp;·&nbsp;
    <a href="/">Voltar ao app</a>
    &nbsp;·&nbsp;
    <a href="/terms">Termos</a>
    &nbsp;·&nbsp;
    <a href="/privacy">Privacidade</a>
</footer>
</body>
</html>
