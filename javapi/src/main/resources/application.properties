spring.application.name=extract-api
server.port=9090
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=6MB

#spring.datasource.url=${DB_URL}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Existing databases must be adopted deliberately by setting
# FLYWAY_BASELINE_ON_MIGRATE=true for one controlled startup. Leave it false
# during normal operation so a connection to the wrong non-empty database
# fails instead of being silently baselined.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Production schema before Flyway
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
ai.api-key=${GEMINI_API_KEY}
ai.gemini-model=${GEMINI_MODEL:gemini-3-flash-preview}
ai.gemini-timeout=${GEMINI_TIMEOUT:3m}
ai.default-timeout=${EXTERNAL_CALL_TIMEOUT:90s}

# CORS — set CORS_ALLOWED_ORIGIN in your .env (e.g. http://localhost:5173 for dev)
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Durable expense-classification workers
classification.batch-size=${CLASSIFICATION_BATCH_SIZE:50}
classification.propagation-batch-size=${CLASSIFICATION_PROPAGATION_BATCH_SIZE:50}
classification.max-ai-attempts=${CLASSIFICATION_MAX_AI_ATTEMPTS:3}
classification.max-apply-attempts=${CLASSIFICATION_MAX_APPLY_ATTEMPTS:3}
classification.lease-duration=${CLASSIFICATION_LEASE_DURATION:10m}
classification.retry-delays=${CLASSIFICATION_RETRY_DELAYS:1m,5m,15m}
classification.catalog-registration-cron=${CLASSIFICATION_CATALOG_REGISTRATION_CRON:0 * * * * *}
classification.batch-creation-cron=${CLASSIFICATION_BATCH_CREATION_CRON:10 * * * * *}
classification.ai-cron=${CLASSIFICATION_AI_CRON:0 */5 * * * *}
classification.ai-recovery-cron=${CLASSIFICATION_AI_RECOVERY_CRON:20 * * * * *}
classification.apply-cron=${CLASSIFICATION_APPLY_CRON:30 * * * * *}
classification.apply-recovery-cron=${CLASSIFICATION_APPLY_RECOVERY_CRON:40 * * * * *}
classification.propagation-cron=${CLASSIFICATION_PROPAGATION_CRON:45 * * * * *}
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:4}

# Gmail SMTP delivery (port 587 uses STARTTLS, not implicit SSL)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:90000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:90000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:90000}
spring.mail.default-encoding=UTF-8
admin.email.sender=${ADMIN_EMAIL_FROM:${SMTP_USERNAME}}
admin.email.recipients=${ADMIN_EMAIL_RECIPIENTS}
admin.email.api-key=${ADMIN_EMAIL_API_KEY}

# Deployment health endpoint. SMTP delivery is monitored separately by the outbox.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
