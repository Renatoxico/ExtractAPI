version: '3.8'
services:
  backend-java:
    build:
      context: ../../javapi
    image: extractapi_backend_java:dev
    container_name: extractapi_backend_java_dev
    ports:
      - "9090:9090"
    env_file:
      - ../../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ../../svelte-frontend
    image: extractapi_frontend_svelte:dev
    container_name: extractapi_frontend_dev
    ports:
      - "80:80"
    depends_on:
      - backend-java
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

