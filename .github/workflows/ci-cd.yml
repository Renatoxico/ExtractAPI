name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: javapi/pom.xml

      - name: Verify Docker availability for Testcontainers
        run: docker info

      - name: Run tests
        run: ./javapi/mvnw verify -f javapi/pom.xml

      - name: Require PostgreSQL integration tests
        shell: bash
        run: |
          report="javapi/target/surefire-reports/TEST-io.github.renatoxico.extract.service.ClassificationPipelinePostgresIntegrationTest.xml"
          if [[ ! -f "$report" ]]; then
            echo "PostgreSQL integration test report was not generated"
            exit 1
          fi
          if grep -Eq 'skipped="[1-9][0-9]*"' "$report"; then
            echo "PostgreSQL integration tests were skipped"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            javapi/target/surefire-reports/
            javapi/target/site/jacoco/
          retention-days: 7

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    environment: TOXIC SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./javapi
          push: true
          tags: |
            ghcr.io/renatoxico/javapi:latest
            ghcr.io/renatoxico/javapi:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Create frontend .env
        run: echo "${{ secrets.FRONTEND_ENV }}" > ./svelte-frontend/.env

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./svelte-frontend
          push: true
          tags: |
            ghcr.io/renatoxico/svelte-frontend:latest
            ghcr.io/renatoxico/svelte-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: TOXIC SERVER
    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@v4

      - name: Copy deployment definition
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: /var/www/extractor/ExtractAPI
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/extractor/ExtractAPI
            echo "${{ secrets.ENV_FILE }}" > .env
            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export BACKEND_IMAGE=ghcr.io/renatoxico/javapi:${{ github.sha }}
            export FRONTEND_IMAGE=ghcr.io/renatoxico/svelte-frontend:${{ github.sha }}
            docker compose pull backend-java frontend
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180
            curl --fail --silent --show-error http://localhost:9090/actuator/health
            curl --fail --silent --show-error http://localhost/
            echo "Deployed commit ${{ github.sha }}"
