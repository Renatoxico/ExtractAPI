name: PR Validation

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: javapi/pom.xml

      - name: Run tests with coverage
        run: ./mvnw verify -f javapi/pom.xml

      - name: Generate JaCoCo coverage report
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: javapi/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          title: "Backend Test Coverage"
          update-comment: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: javapi/target/site/jacoco/
          retention-days: 14

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: svelte-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: svelte-frontend

      - name: Build
        run: npm run build
        working-directory: svelte-frontend
        env:
          VITE_API_URL: https://placeholder.test
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_REVENUECAT_CHECKOUT_URL: https://placeholder.test
