services:
  backend-java:
    build:
      context: ./javapi
    container_name: backend-java
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    secrets:
      - source: firebase-service-account
        target: firebase-service-account.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - app-network

  frontend:
    build:
      context: ./svelte-frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend-java
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

secrets:
  firebase-service-account:
    file: ${FIREBASE_CREDENTIALS_PATH}
