services:
  backend-java:
    build:
      context: ./javapi # Path to the directory containing the Dockerfile for backend-java
    container_name: backend-java
    ports:
      - "9091:9090"
    env_file:
      - .env
    restart: always
    depends_on:
      - backend-python
    networks:
      - app-network

  backend-python:
    build:
      context: ./py-extractor # Path to the directory containing the Dockerfile for backend-python
    container_name: backend-python
    ports:
      - "9000:9000"
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
