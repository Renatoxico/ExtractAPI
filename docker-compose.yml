services:
  backend-java:
    image: ${BACKEND_IMAGE:-extractapi-backend-java:local}
    build:
      context: ./javapi
    container_name: backend-java
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    secrets:
      - source: firebase-service-account
        target: firebase-service-account.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  frontend:
    image: ${FRONTEND_IMAGE:-extractapi-frontend:local}
    build:
      context: ./svelte-frontend
    container_name: frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend-java:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

secrets:
  firebase-service-account:
    file: ${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS must point to the Firebase service-account JSON}
