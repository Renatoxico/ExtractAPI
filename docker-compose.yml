services:
  backend-java:
    build: 
      context: ./javapi
      dockerfile: Dockerfile
    ports:
      - "9090:9090"  # Updated to match the Spring Boot app's port
    image: ghcr.io/Renatoxico/javapi:latest
    volumes:
      - ./javapi:/app
    working_dir: /app
    #command: ./mvnw spring-boot:run
    command: ./mvnw compile spring-boot:run
    depends_on:
      - backend-python
    env_file:
      - .env
    restart: always
    networks:
      - app-network
      - default

  backend-python:
    build: ./py-extractor
    image: ghcr.io/Renatoxico/py-extractor:latest
    ports:
      - "9000:9000"
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
